---
pageInfo:
  title: lab.kzick.dev
  description: Andy's homelab dashboard
  navLinks:
    - title: kzick.dev
      path: https://kzick.dev

appConfig:
  theme: base
  layout: auto
  iconSize: medium
  startingView: default
  defaultOpeningMethod: newtab
  showSplashScreen: false
  externalStyleSheet:
    - 'https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap'
  hideComponents:
    hideSettings: false
    hideFooter: true
    hideNav: false
    hideSidebar: true
  customCss: |
    /* ── K-ZICK DESIGN SYSTEM — Dashy Override ── */

    /* Tokens */
    :root {
      --bg: #0a0f1a;
      --surface: #111820;
      --surface-raised: #1a1f2e;
      --border: #2a2f3e;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --accent: #06b6d4;
      --accent-light: #22d3ee;
      --glass: rgba(15, 23, 42, 0.8);
      --blur: 24px;
    }

    /* Page background */
    body, #app, .home {
      background-color: var(--bg) !important;
      background-image: radial-gradient(circle at 60% 40%, rgba(6, 182, 212, 0.07) 0%, transparent 55%) !important;
      font-family: 'Inter', system-ui, sans-serif !important;
      color: var(--text-primary) !important;
    }

    /* Navbar */
    nav.navbar {
      background: rgba(10, 15, 26, 0.92) !important;
      border-bottom: 1px solid var(--border) !important;
      backdrop-filter: blur(var(--blur)) !important;
      box-shadow: none !important;
    }

    nav.navbar .navbar-brand span,
    nav.navbar .site-name {
      font-family: 'Inter', system-ui, sans-serif !important;
      font-weight: 800 !important;
      color: var(--text-primary) !important;
      letter-spacing: -0.02em !important;
    }

    nav.navbar .subtitle {
      color: var(--text-secondary) !important;
      font-size: 0.8rem !important;
    }

    nav.navbar a, nav.navbar .nav-item {
      color: var(--text-secondary) !important;
      font-family: 'Inter', system-ui, sans-serif !important;
    }

    nav.navbar a:hover {
      color: var(--accent-light) !important;
    }

    /* Search bar */
    .search-field-container, .search-wrap {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 8px !important;
      box-shadow: none !important;
    }

    .search-field-container input, .search-wrap input {
      background: transparent !important;
      color: var(--text-primary) !important;
      font-family: 'Inter', system-ui, sans-serif !important;
      border: none !important;
      box-shadow: none !important;
    }

    .search-field-container input::placeholder, .search-wrap input::placeholder {
      color: var(--text-secondary) !important;
    }

    .search-field-container:focus-within, .search-wrap:focus-within {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1) !important;
    }

    /* Section wrapper */
    .section-wrapper, .items-wrapper {
      background: transparent !important;
    }

    /* Section outer container — dissolved */
    .section {
      background: transparent !important;
      backdrop-filter: none !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    /* Section header — hidden entirely */
    .section .title-wrap,
    .section .section-title {
      display: none !important;
    }

    /* Item tiles */
    .item-wrapper .item, .item {
      background: var(--surface-raised) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      box-shadow: none !important;
      transition: border-color 0.2s ease-out, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease-out !important;
    }

    .item-wrapper .item:hover, .item:hover {
      border-color: var(--accent) !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.12) !important;
      background: rgba(26, 31, 46, 0.95) !important;
    }

    /* Item title text */
    .item .tile-title, .item h4, .item .item-title {
      font-family: 'Inter', system-ui, sans-serif !important;
      font-weight: 600 !important;
      font-size: 0.9rem !important;
      color: var(--text-primary) !important;
    }

    /* Item description text */
    .item .item-description, .item p {
      font-family: 'Inter', system-ui, sans-serif !important;
      font-size: 0.75rem !important;
      color: var(--text-secondary) !important;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

